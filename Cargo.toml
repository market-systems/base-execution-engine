[workspace]
members = [
    "crates/app",
    "crates/config",
    "crates/types",
    "crates/registry",
    "crates/ingest",
    "crates/decision",
    "crates/execution",
]
default-members = ["crates/app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
