[workspace]
members = [
    "crates/app",
    "crates/config",
    "crates/types",
    "crates/registry",
    "crates/ingest",
    "crates/decision",
    "crates/execution",
    "crates/observability",
    "crates/rpc",
    "crates/storage",
    "crates/markets",
    "crates/discovery",
]
default-members = ["crates/app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.17"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
alloy-primitives = "0.8"
alloy-sol-types = "0.8"
alloy-consensus = "0.8"
alloy-network = "0.8"
alloy-provider = { version = "0.8", default-features = false, features = ["reqwest", "ws", "ipc"] }
alloy-pubsub = "0.8"
alloy-rpc-client = "0.8"
alloy-rpc-types-eth = "0.8"
alloy-signer = "0.8"
alloy-signer-local = "0.8"
alloy-transport = "0.8"
alloy-transport-http = { version = "0.8", default-features = false, features = ["reqwest", "reqwest-rustls-tls"] }
alloy-transport-ws = "0.8"
alloy-transport-ipc = "0.8"
alloy-eips = "0.8"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
