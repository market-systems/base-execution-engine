name: base-execution-engine

services:
  engine:
    build: .
    container_name: base-execution-engine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      EXECUTION_MODE: ${EXECUTION_MODE:-shadow}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INGEST_CHAIN_ID: ${INGEST_CHAIN_ID:-8453}
      INGEST_CHANNEL: ${INGEST_CHANNEL:-ipc}
      INGEST_IPC_FILE_PATH: ${INGEST_IPC_FILE_PATH:-/app/node-data/geth.ipc}
      INGEST_WS_URL: ${INGEST_WS_URL:-}
      INGEST_FLASHBLOCKS_WS_URL: ${INGEST_FLASHBLOCKS_WS_URL:-wss://mainnet-preconf.base.org}
      INGEST_SUBSCRIBE_TRANSACTIONS: ${INGEST_SUBSCRIBE_TRANSACTIONS:-true}
      INGEST_SUBSCRIBE_LOGS: ${INGEST_SUBSCRIBE_LOGS:-true}
      INGEST_SUBSCRIBE_BLOCKS: ${INGEST_SUBSCRIBE_BLOCKS:-true}
      RPC_CHAIN_ID: ${RPC_CHAIN_ID:-8453}
      RPC_IPC_FILE_PATH: ${RPC_IPC_FILE_PATH:-/app/node-data/geth.ipc}
      RPC_HTTP_URL: ${RPC_HTTP_URL:-}
      RPC_WS_URL: ${RPC_WS_URL:-}
      RPC_FLASHBLOCKS_WS_URL: ${RPC_FLASHBLOCKS_WS_URL:-wss://mainnet-preconf.base.org}
      FLASHBLOCKS_WS_URL: ${FLASHBLOCKS_WS_URL:-wss://mainnet-preconf.base.org}
      MAX_ROUTE_HOPS: ${MAX_ROUTE_HOPS:-3}
      MAX_CANDIDATE_ROUTES: ${MAX_CANDIDATE_ROUTES:-16}
      STORAGE_DATABASE_URL: ${STORAGE_DATABASE_URL:-}
      STORAGE_AUTO_MIGRATE: ${STORAGE_AUTO_MIGRATE:-true}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_HEALTHZ_BIND_ADDR: ${METRICS_HEALTHZ_BIND_ADDR:-0.0.0.0:9000}
      METRICS_PROMETHEUS_BIND_ADDR: ${METRICS_PROMETHEUS_BIND_ADDR:-0.0.0.0:9100}

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    network_mode: "host"

    volumes:
      - ${BASE_NODE_DATA_DIR:-/home/ubuntu/node/data/geth}:/app/node-data
